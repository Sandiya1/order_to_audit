{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:640px"><div class="card-body">
<h5>{{ title }}</h5>
<form method="post">{% csrf_token %}
 {{ form.non_field_errors }}
 {% for f in form %}<div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}{{ f.errors }}</div>{% endfor %}
 <button class="btn btn-primary">Save</button>
</form></div></div>
<script>document.querySelectorAll('input,select,textarea').forEach(e=>{if(e.type!=='hidden')e.classList.add(e.tagName==='SELECT'?'form-select':'form-control')})</script>
{% endblock %}
