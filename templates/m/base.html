{% load ui static %}<!doctype html>
<html lang="en"><head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#212529">
<title>{% block title %}Orders{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f3f4f6;padding-bottom:78px;font-size:17px}.card{border:0;box-shadow:0 1px 3px rgba(0,0,0,.1)}
 .tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;padding-bottom:env(safe-area-inset-bottom)}
 .tabbar a{flex:1;text-align:center;padding:10px 0;text-decoration:none;color:#555;font-size:13px}.tabbar a.on{color:#0d6efd;font-weight:600}.tabbar span{display:block;font-size:22px}
 .num{font-variant-numeric:tabular-nums}.btn-lg{padding:.8rem 1rem}</style>
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/theme.css' %}"></head>
<body>
<div class="bg-dark text-white px-3 py-2 d-flex justify-content-between align-items-center">
 <b>🥨 {{ COMPANY.name }}</b><span class="small">{{ request.user.get_full_name|default:request.user.username }} · <a class="text-white" href="{% url 'logout' %}">Logout</a></span></div>
<div id="net" class="text-center small py-1" style="display:none"></div>
<div class="container py-3" style="max-width:640px">
 {% for m in messages %}<div class="alert alert-info py-2">{{ m }}</div>{% endfor %}
 {% block content %}{% endblock %}</div>
<div class="tabbar">
 <a href="{% url 'm_home' %}" class="{% block t1 %}{% endblock %}"><span>🏠</span>Home</a>
 <a href="{% url 'm_new' %}" class="{% block t2 %}{% endblock %}"><span>➕</span>New order</a>
 <a href="{% url 'm_orders' %}" class="{% block t3 %}{% endblock %}"><span>📋</span>My orders</a>
 <a href="{% url 'm_sales' %}" class="{% block t4 %}{% endblock %}"><span>📈</span>Sales</a></div>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('{% url "m_sw" %}',{scope:'/m/'}).catch(()=>{})}</script>
{% block scripts %}{% endblock %}
</body></html>
